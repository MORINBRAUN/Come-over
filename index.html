<head>

<title>Come Over: אונבורדינג</title>
<style>
:root{--cream:#fbf5ec;--paper:#fffdf9;--ink:#2a211b;--muted:#7d6e62;--line:#eadfce;--accent:#d1572f;--accent-soft:#fbe3d8;--green:#4f7a58;--green-soft:#e2eede;--ease:cubic-bezier(0.23,1,0.32,1);--dx:-24px}
:root[dir=ltr]{--dx:24px}
*{box-sizing:border-box;margin:0}
html,body{background:#e9e4dc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Heebo","Arial Hebrew",Arial,sans-serif;color:var(--ink)}
body{min-height:100vh;display:flex;justify-content:center;padding:16px 0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.phone{width:390px;max-width:100%;height:780px;max-height:calc(100vh - 32px);background:var(--cream);border-radius:34px;overflow:hidden;position:relative;box-shadow:0 0 0 8px #1d1713,0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column}
@media (max-width:430px){body{padding:0}.phone{border-radius:0;box-shadow:none;height:100vh;height:100dvh;max-height:none}}
.status{height:30px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600;direction:ltr}
.top{flex:none;display:flex;align-items:center;gap:12px;padding:4px 16px 8px}
.back{width:40px;height:40px;border-radius:50%;font-size:20px;color:var(--muted);transition:transform 120ms ease-out}.back:active{transform:scale(.92)}.back[hidden]{visibility:hidden;display:block!important}
.bar{flex:1;height:6px;background:#efe5d6;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width 300ms var(--ease)}
.cnt{font-size:12px;color:var(--muted);min-width:44px;text-align:end;font-variant-numeric:tabular-nums}
.stage{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px 24px 20px;overflow-y:auto;animation:in 300ms var(--ease) both}
.screen.back-in{animation-name:inback}
@keyframes in{from{opacity:0;transform:translateX(var(--dx))}to{opacity:1;transform:none}}
@keyframes inback{from{opacity:0;transform:translateX(calc(var(--dx)*-1))}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.bar i{transition:none}.mic.rec{animation:none}*{transition:none!important}}
h1{font-size:28px;line-height:1.2;margin:8px 0 6px}
.sub{color:var(--muted);font-size:15px;line-height:1.45;margin-bottom:16px}
textarea,input[type=text]{width:100%;font:inherit;font-size:17px;line-height:1.5;border:1.5px solid var(--line);border-radius:16px;padding:14px;background:var(--paper);color:var(--ink);resize:none}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.tawrap{position:relative}.tawrap textarea{padding-bottom:52px}
.mic{position:absolute;bottom:10px;inset-inline-end:10px;width:44px;height:44px;border-radius:50%;background:var(--accent-soft);font-size:20px;display:grid;place-items:center;transition:background 150ms ease-out,transform 120ms ease-out}
.mic:active{transform:scale(.92)}.mic.rec{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.micmsg{font-size:13px;color:#9a3a18;min-height:18px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding-block:6px;padding-inline:8px 12px;border-radius:99px;background:#efe5d6;font-size:14px;transition:background 150ms ease-out}
.chip button{width:24px;height:24px;border-radius:50%;color:var(--muted);font-size:16px;line-height:1}
.chip.sel{background:var(--accent-soft);color:#9a3a18;padding:9px 14px;font-weight:600}
.chip.pick{padding:9px 14px;font-size:15px}.chip.pick:active{transform:scale(.96)}
.chip.like{background:var(--green-soft);color:#2f5a38}.chip.avoid{background:#fdecc8;color:#7a5200}.chip.note{background:#efe5d6}
.lbl{font-size:12px;color:var(--muted);margin:16px 0 0;letter-spacing:.04em}
.spacer{flex:1;min-height:12px}
.cta{width:100%;background:var(--accent);color:#fff;padding:16px;border-radius:18px;font-weight:700;font-size:17px;margin-top:16px;transition:transform 120ms ease-out,opacity 150ms;flex:none}
.cta:active{transform:scale(.98)}.cta:disabled{opacity:.4}
.link{display:block;margin:12px auto 0;font-size:14px;color:var(--muted);text-decoration:underline;padding:8px;flex:none}
.big{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:16px;font-size:17px;transition:border-color 150ms ease-out,background 150ms ease-out}
.opt:active{transform:scale(.99)}.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.emoji{font-size:26px}
.who{display:flex;align-items:center;gap:12px;margin-bottom:6px}.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;background:var(--accent-soft);color:#9a3a18}
/* menu rows */
.mg{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.06em;margin:16px 0 6px}
.mrow{display:flex;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;margin-bottom:8px;transition:border-color 150ms ease-out,background 150ms ease-out}
.mrow.on{border-color:#e8b9a5;background:#fff8f3}
.mrow .tog{width:52px;height:56px;flex:none;display:grid;place-items:center}
.mrow .tick{width:24px;height:24px;border-radius:50%;border:2px solid #cdbda7;display:grid;place-items:center;transition:background 150ms ease-out,border-color 150ms ease-out}
.mrow.on .tick{background:var(--accent);border-color:var(--accent)}.mrow.on .tick::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(40deg) translate(-1px,-1px)}
.mrow .body{flex:1;text-align:start;padding:10px 0;min-height:56px;display:flex;flex-direction:column;justify-content:center}
.mrow b{font-size:17px}.mrow .meta{font-size:13px;color:var(--muted);margin-top:2px}
.mrow:not(.on) b{color:var(--muted)}
.mrow .go{width:40px;font-size:18px;color:var(--muted);flex:none;text-align:center}
.badge{display:inline-block;font-size:11px;background:#efe5d6;color:var(--muted);border-radius:99px;padding:1px 8px;margin-inline-start:6px;font-weight:600}
.note2{background:#fdecc8;color:#7a5200;border-radius:12px;padding:9px 12px;font-size:13px;margin-top:10px}
/* method screen */
.meth{display:flex;flex-direction:column;gap:6px;text-align:start;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;transition:border-color 150ms ease-out,background 150ms ease-out}
.meth:active{transform:scale(.99)}.meth[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.meth b{font-size:18px}.meth .facts{display:flex;gap:6px;flex-wrap:wrap}.meth .facts span{font-size:12px;background:#efe5d6;border-radius:99px;padding:2px 9px;color:#4a3d33}
.meth .why{font-size:13px;color:#2f5a38}
a.cta{display:block;text-align:center;text-decoration:none}
.otoast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#2a211b;color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;white-space:nowrap;animation:in 200ms var(--ease) both}

[hidden]{display:none!important}
#home{width:390px;max-width:100%;display:flex;justify-content:center}#home .phone{width:100%}
.homein{flex:1;overflow-y:auto;padding:12px 24px 28px}
.homein h1{font-size:34px;margin:10px 0 4px}
.homein .cta{margin-top:6px}
.mcard{position:relative;display:flex;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;margin-bottom:10px;transition:border-color 150ms ease-out}
.mcard:active{transform:scale(.99)}
.mbody{flex:1;text-align:start;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mbody b{font-size:18px}.mbody span{font-size:14px;color:var(--ink)}.mbody .mu{font-size:12px;color:var(--muted)}
.mgo{font-size:14px;font-weight:700;color:var(--accent);padding:0 6px}
.mdel{width:48px;align-self:stretch;font-size:18px;color:var(--muted);border-inline-start:1px solid var(--line)}
.mdel:active{transform:scale(.92)}

.spin{width:44px;height:44px;border-radius:50%;border:4px solid #efe5d6;border-top-color:var(--accent);animation:sp 800ms linear infinite;margin:40px auto 18px}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* ===== meal screen (table, menu, recipes, shopping) ===== */
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth;padding-bottom:28px;-webkit-overflow-scrolling:touch}
#meal{width:390px;max-width:100%;display:flex;justify-content:center}

  --cream:#fbf5ec; --paper:#fffdf9; --ink:#2a211b; --muted:#7d6e62; --line:#eadfce;

function parseNamesHE(t){

/* tiny stand-in for the real "understand free text" step, sentence by sentence */
function extractHE(text){
  const out={likes:[],avoid:[],notes:[]};
  text.split(/[.\n]+/).map(s=>s.trim()).filter(Boolean).forEach(s=>{
    const items=x=>x.split(/,|\sו(?=\S)/).map(i=>i.replace(/^(ו|את)\s*/,'').trim()).filter(Boolean);
    if(/^בלי\s/.test(s)){out.avoid.push(...items(s.replace(/^בלי\s*/,'')).map(i=>i.replace(/^בלי\s*/,'')))}
    else if(/לא (אוכל|אוכלת|אוהב|אוהבת)/.test(s)){out.avoid.push(...items(s.replace(/.*לא (אוכל|אוכלת|אוהב|אוהבת)\s*/,'')))}
    else if(/^(אוהב|אוהבת)\s/.test(s)){out.likes.push(...items(s.replace(/^(אוהב|אוהבת)\s*/,'')))}
    else out.notes.push(s);
  });
  return out}

function parseNamesEN(t){
  const cap=x=>x.charAt(0).toUpperCase()+x.slice(1);
  const s=t.replace(/\s+(?:and|&|\+)\s+/gi,',');
  const parts=/[\n,;]/.test(s)?s.split(/[\n,;]+/):s.split(/\s+/);
  return [...new Set(parts.map(x=>x.trim()).filter(x=>x&&!/^(?:and|&|\+)$/i.test(x)).map(cap))]}
function extractEN(text,name){
  const out={likes:[],avoid:[],notes:[]};
  const rx=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const subj=new RegExp('^(?:he|she|they|i|'+(name?rx(name)+'|':'')+'we)\\b[\\s,:\\-]*(?=\\S)','i');
  const items=x=>x.split(RX.items).map(i=>i.trim().replace(/^(?:and|or|also|plus|any|all|some|the)\s+/i,'').replace(/^no\s+/i,'').replace(/[\s.!]+$/,'')).filter(Boolean);
  const AV=[
    /^(?:no|without|skip|zero)\s+(.+)$/i,
    /^(?:(?:really|absolutely|totally)\s+)?(?:doesn'?t|does not|don'?t|do not|won'?t|will not|can'?t|cannot|never)\s+(?:really\s+|ever\s+)?(?:eat|like|touch|want|have|enjoy|stand|tolerate)s?\s+(.+)$/i,
    /^(?:really\s+)?(?:hates?|dislikes?|avoids?|can'?t stand|cannot stand|stays? away from|(?:is |are )?allergic to|(?:is |are )?intolerant (?:to|of)|(?:is |are )?not (?:a fan of|into)|isn'?t (?:a fan of|into))\s+(.+)$/i];
  const LK=/^(?:(?:really|absolutely|totally|always|especially|just)\s+)?(?:likes?|loves?|enjoys?|adores?|is (?:a (?:big |huge )?)?fan of|(?:is|are) into|prefers?|craves?|wants?)\s+(.+)$/i;
  text.split(/[.!?\n;]+/).forEach(sent=>{
    sent.split(/\s*,?\s*\b(?:but|though|however)\b\s*|\s+and\s+(?=(?:(?:he|she|they)\s+)?(?:doesn'?t|does not|don'?t|won'?t|can'?t|never|hates?|dislikes?|avoids?|loves?|likes?|enjoys?|no\s))/i).forEach(c=>{
      c=(c||'').trim().replace(subj,'').trim();if(!c)return;
      if(/^(?:is |are )?(?:a )?(?:strict )?(?:vegan|vegetarian)\b/i.test(c)){out.avoid.push('meat','fish');if(/vegan/i.test(c))out.avoid.push('mayo');return}
      let m;
      for(const re of AV){if((m=c.match(re))){out.avoid.push(...items(m[1]));return}}
      if((m=c.match(LK))){out.likes.push(...items(m[1]));return}
      out.notes.push(c)})});
  return out}

    kept(n,'likes').forEach(item=>{

function dictate(btn){
  const ta=btn.parentElement.querySelector('textarea'),msg=$('micmsg');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){msg.textContent=tr('ההכתבה לא נתמכת בדפדפן הזה. לחצי על המיקרופון במקלדת של הטלפון.');return}
  if(rec){rec.stop();return}
  rec=new SR();rec.lang=SPEECH;rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=()=>{btn.classList.add('rec');msg.dataset.rec=1;msg.textContent=tr('מקשיבה… דברי')};
  rec.onresult=e=>{const t=[...e.results].map(r=>r[0].transcript).join(' ').trim();if(!t)return;ta.value+=(ta.value&&!/\s$/.test(ta.value)?' ':'')+t;ta.dispatchEvent(new Event('input',{bubbles:true}))};
  rec.onerror=e=>{delete msg.dataset.rec;msg.textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?tr('אין הרשאה למיקרופון בדף הזה. לחצי על המיקרופון במקלדת של הטלפון.'):tr('לא הצלחתי לשמוע. נסי שוב או השתמשי במיקרופון של המקלדת.')};
  rec.onend=()=>{btn.classList.remove('rec');if(msg.dataset.rec)msg.textContent='';delete msg.dataset.rec;rec=null};
  try{rec.start()}catch(_){rec=null;msg.textContent=tr('לא הצלחתי להפעיל את המיקרופון.')}}

   <label class="lbl">${tr('הערה')}</label><textarea data-note="${nm}" rows="2">${inf[1]}</textarea>
   ${K.map(c=>`<h5>${tr(c)}</h5>`+byCat(c).map(([id,d])=>`<button class="item${d.who.includes(nm)?' done':''}" data-pref="${id}|${nm}"><span class="check"></span><span class="nm">${d.n}</span></button>`).join('')).join('')}
   <label class="lbl">${tr('להוסיף עוד משהו שהוא אוהב')}</label><form class="likeform" data-like="${nm}"><input name="x" type="text" dir="auto" enterkeyhint="done" autocomplete="off" placeholder="${tr('למשל: קציצות, סלט כרוב')}" aria-label="${tr('להוסיף מאכל אהוב')}"><button type="submit">${tr('הוספה')}</button></form><p class="likemsg" id="likemsg"></p>`}
function tableHTML(){
  const n=present().length,dn=Object.values(D).filter(d=>d.who.length).length;
  return `<div class="counts"><div><b>${n}</b>${tr('אנשים')}</div><div><b>${n}</b>${tr('כיסאות')}</div><div><b>${n}</b>${tr('צלחות')}</div><div><b>${n}</b>${tr('כוסות')}</div><div><b>${dn}</b>${tr('מנות')}</div></div>${tableSVG()}<div class="tcard" id="tcard">${cardHTML()}</div>`}
function openPrefs(name){
  stage.querySelector('.sheet')?.remove();
  const inf=INFO[name],p=stage.querySelector('.phone'),sh=document.createElement('div');sh.className='sheet';
  sh.innerHTML=`<div class="sheet-in"><h2>${tr('מה {0} אוכל?',name)} <button data-close aria-label="${tr('סגירה')}">×</button></h2><p class="rm">${inf[0]?inf[0]+". ":""}${tr('סמני מה כן, ובטלי מה לא. הכמויות מתעדכנות.')}</p>
   <label class="lbl">${tr('הערה (אופציונלי)')}</label><textarea data-note="${name}" rows="2">${inf[1]}</textarea>
   <label class="lbl">${tr('להוסיף משהו שהוא או היא אוהבים')}</label><form class="likeform" data-like="${name}"><input name="x" type="text" dir="auto" enterkeyhint="done" autocomplete="off" placeholder="${tr('למשל: שניצל, קציצות, סלט כרוב')}" aria-label="${tr('להוסיף מאכל אהוב')}"><button type="submit">${tr('הוספה')}</button></form><p class="likemsg" id="likemsg"></p>
   ${K.map(c=>`<h5>${tr(c)}</h5>`+byCat(c).map(([id,d])=>`<button class="item${d.who.includes(name)?' done':''}" data-pref="${id}|${name}"><span class="check"></span><span class="nm">${d.n}</span></button>`).join('')).join('')}
   <button class="cta2" data-close>${tr('סיום')}</button><button class="reset" data-reset>${tr('איפוס להצעה המקורית')}</button></div>`;
  sh.addEventListener('click',e=>{if(e.target===sh)sh.remove()});p.appendChild(sh)}
function save(){saveMealState({who:Object.fromEntries(Object.entries(D).map(([i,d])=>[i,d.who])),gone:GONE,extra:EXTRA,done:[...DONE],edit:EDIT,notes:Object.fromEntries(Object.entries(INFO).map(([n,v])=>[n,v[1]]))})}
function renderTable(){const e=stage.querySelector('#tbl');if(!e)return;if(SEL&&SEL.t==='p'&&GONE[SEL.id])SEL=null;e.innerHTML=tableHTML()}

/* ---------- screen ---------- */
let TAB='t';
const old=document.getElementById('meal'),stage=old.cloneNode(false);old.replaceWith(stage);stage.hidden=false;
const screen = () => `<div class="phone v2">
  <div class="scroll" id="sc">
   <div class="hero">${bar('').replace('class="status"','class="status" style="padding:0;color:#cbbdae"')}
     <div class="navrow"><button class="backmenu" data-home>${tr('‹ לכל הארוחות')}</button><button class="backmenu" data-menu>${tr('לשינוי התפריט')}</button></div>
     <small>${tr('COME OVER · שישי 30.10')}</small>
     <h1 class="enter">${tr('ארוחת<br>שישי')}</h1>
     <p id="heroP">${heroP()}</p></div>
   <nav role="tablist">${[["t",tr('שולחן')],["m",tr('תפריט')],["s",tr('קניות')]].map(([k,n])=>`<button role="tab" data-tab="${k}" aria-selected="${k===TAB}">${n}</button>`).join('')}</nav>
   <section id="t" ${TAB==='t'?'':'hidden'}><div class="num">01</div><h2>${tr('השולחן')}</h2><div id="tbl">${tableHTML()}</div>
     <div class="group"><h5>${tr('מי מגיע · לחיצה על שם פותחת את ההעדפות שלו')}</h5><div class="who" id="guests">${guestsHTML()}</div></div></section>
   <section id="m" ${TAB==='m'?'':'hidden'}><button class="backt" data-tab="t">${tr('‹ חזרה לשולחן')}</button><div class="num">02</div><h2>${tr('התפריט והמתכונים')}</h2>
     ${K.map(c=>`<div class="group"><h5>${tr(c)}</h5>`+byCat(c).map(([id,d])=>rowHTML(id)).join('')+'</div>').join('')}
   </section>
   <section id="s" ${TAB==='s'?'':'hidden'}><button class="backt" data-tab="t">${tr('‹ חזרה לשולחן')}</button><div class="num">03</div><h2>${tr('רשימת קניות')}</h2>
     <div id="shop">${shopHTML()}</div>
     <form class="addform" data-add><input name="x" type="text" dir="auto" enterkeyhint="done" autocomplete="off" placeholder="${tr('להוסיף לרשימה (למשל: מפיות, 2 בקבוקי קולה)')}" aria-label="${tr('להוסיף פריט לרשימת הקניות')}"><button type="submit">${tr('הוספה')}</button></form>
      <button class="cta" data-copy>${tr('העתיקי את הרשימה לוואטסאפ')}</button>
   <button class="cta alt" data-serve>${tr('הוגש! שמרי את הארוחה')}</button>
   <button class="linkq" data-home>${tr('‹ לכל הארוחות')}</button>
   </section>
  </div></div>`;
if(S.restore){try{const e0=loadMeals().list.find(x=>x.id===CUR),j=e0&&e0.mealState;if(j){for(const i in j.who)if(D[i])D[i].who=j.who[i].filter(w=>GUESTS.includes(w));Object.assign(GONE,j.gone||{});EXTRA=(j.extra||[]).filter(x=>typeof x==='string');(j.done||[]).forEach(x=>DONE.add(x));Object.assign(EDIT,j.edit||{});for(const n in j.notes)if(INFO[n])INFO[n][1]=j.notes[n]}}catch(_){}S.restore=false}
stage.innerHTML = screen();

/* ---------- in-variant interactions ---------- */
let toastTimer;
function toast(msg,undo){stage.querySelector('.toast')?.remove();clearTimeout(toastTimer);const p=stage.querySelector('.phone');const t=document.createElement('div');t.className='toast';t.textContent=msg;if(undo){const b=document.createElement('button');b.textContent=tr('ביטול|undo');b.onclick=()=>{undo();t.remove()};t.appendChild(b)}p.appendChild(t);toastTimer=setTimeout(()=>t.remove(),undo?4000:1800)}
function showTab(k){TAB=k;stage.querySelectorAll('nav [data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===k));
  ['t','m','s'].forEach(x=>{const e=stage.querySelector('#'+x);if(e)e.hidden=x!==k});
  const sc=stage.querySelector('#sc'),nav=sc.querySelector('nav');sc.scrollTo({top:Math.max(0,nav.offsetTop),behavior:'instant'})}
function refreshAll(){save();renderTable();for(const id in D)setWho(id);stage.querySelector('#guests').innerHTML=guestsHTML();stage.querySelector('#heroP').textContent=heroP()}
function setWho(id){const r=stage.querySelector(`[data-row="${id}"]`);r.querySelector('.who').innerHTML=whoHTML(id);r.querySelector('.meta').textContent=metaHTML(id);r.classList.toggle('hide',!!D[id].alt&&!D[id].who.length);stage.querySelector('#shop').innerHTML=shopHTML();const rb=r.querySelector('.rb');if(rb)rb.innerHTML=recipeBody(id);renderTable()}
stage.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.dataset.editf!==undefined){const k=e.target.dataset.editf,n=e.target.elements.n.value.trim(),q=e.target.elements.q.value.trim();
    if(!n)return;
    if(k.startsWith('x|'))EXTRA[+k.slice(2)]=n.slice(0,60);else EDIT[k]={n:n.slice(0,60),q:q.slice(0,40)};
    EDITING=null;save();stage.querySelector('#shop').innerHTML=shopHTML();toast(tr('נשמר'));return}
  if(e.target.dataset.like){const nm=e.target.dataset.like,i=e.target.elements.x,v=i.value.trim();if(!v)return;
    const added=[],notes=[];
    v.split(RX.items).map(x=>x.trim()).filter(Boolean).forEach(it=>{const lo=it.toLowerCase();let best=null,bl=0;CAT.forEach(d=>d.kw.forEach(k=>{if(lo.includes(k)&&k.length>bl){best=d;bl=k.length}}));
      if(best&&D[best.id]){if(!D[best.id].who.includes(nm))D[best.id].who.push(nm);added.push(best.n)}else notes.push(it)});
    if(notes.length){const n=INFO[nm];n[1]=(n[1]?n[1]+' ':'')+tr('אוהב/ת גם: ')+notes.join(', ')+'.';}
    i.value='';refreshAll();
    stage.querySelector('#likemsg').textContent=(added.length?tr('נוסף: ')+added.join(', ')+'. ':'')+(notes.length?tr('לא מצאתי מנה ל: ')+notes.join(', ')+tr(', שמרתי בהערה.'):'');return}
  const i=e.target.elements.x,v=i.value.trim();if(!v)return;EXTRA.push(v.slice(0,60));i.value='';save();stage.querySelector('#shop').innerHTML=shopHTML();toast(tr('נוסף לרשימה'))});
stage.addEventListener('input',e=>{if(e.target.dataset.note){INFO[e.target.dataset.note][1]=e.target.value;save()}});
stage.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-seat],[data-dish]')){e.preventDefault();e.target.closest('[data-seat],[data-dish]').dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
stage.addEventListener('click',e=>{
  const t=e.target.closest('[data-edit],[data-editcancel],[data-editdel],[data-tab],[data-check],[data-copy],[data-home],[data-menu],[data-serve],[data-restart],[data-rm],[data-rmg],[data-addg],[data-seat],[data-dish],[data-xdel],[data-pref-open],[data-pref],[data-close],[data-reset],.v2 nav a');
  if(!t)return;
  if(t.dataset.edit!==undefined){EDITING=t.dataset.edit;stage.querySelector('#shop').innerHTML=shopHTML();stage.querySelector('.editrow input')?.focus({preventScroll:true})}
  else if(t.hasAttribute('data-editcancel')){EDITING=null;stage.querySelector('#shop').innerHTML=shopHTML()}
  else if(t.dataset.editdel!==undefined){const k=t.dataset.editdel,prev=EDIT[k];
    if(k.startsWith('x|')){const i=+k.slice(2),n=EXTRA.splice(i,1)[0];EDITING=null;save();stage.querySelector('#shop').innerHTML=shopHTML();toast(`${tr('{0} הוסר',n)}`,()=>{EXTRA.splice(i,0,n);save();stage.querySelector('#shop').innerHTML=shopHTML()})}
    else{EDIT[k]={...(prev||{}),del:1};EDITING=null;save();stage.querySelector('#shop').innerHTML=shopHTML();toast(tr('הוסר מהרשימה'),()=>{if(prev)EDIT[k]=prev;else delete EDIT[k];save();stage.querySelector('#shop').innerHTML=shopHTML()})}}
  else if(t.dataset.tab){showTab(t.dataset.tab)}
  else if(t.hasAttribute('data-home')){showHome()}
  else if(t.hasAttribute('data-menu')){leaveMeal()}
  else if(t.hasAttribute('data-restart')){S.names=[];S.menu=null;S.kosher=null;S.txt={};S.drop={};S.kWho=new Set();clearPlan();leaveMeal(0)}
  else if(t.hasAttribute('data-serve')){const ids=Object.keys(D).filter(i=>D[i].who.length);try{localStorage.setItem(HK,JSON.stringify({date:new Date().toISOString().slice(0,10),ids}))}catch(_){}t.disabled=true;t.textContent=tr('✔ נשמר. בפעם הבאה לא אחזור על זה');toast(tr('נשמר'))}
  else if(t.dataset.xdel!==undefined){const n=EXTRA.splice(+t.dataset.xdel,1)[0];save();stage.querySelector('#shop').innerHTML=shopHTML();toast(`${tr('{0} נמחק',n)}`,()=>{EXTRA.push(n);save();stage.querySelector('#shop').innerHTML=shopHTML()})}
  else if(t.dataset.prefOpen){SEL={t:'p',id:t.dataset.prefOpen};showTab('t');renderTable();stage.querySelector('#tcard').scrollIntoView({block:'start',behavior:'instant'})}
  else if(t.dataset.pref){
    const [id,w]=t.dataset.pref.split('|'),i=D[id].who.indexOf(w);
    if(i>-1)D[id].who.splice(i,1);else D[id].who.push(w);
    t.classList.toggle('done',i<0);refreshAll();
  } else if(t.hasAttribute('data-close')){stage.querySelector('.sheet')?.remove()}
  else if(t.hasAttribute('data-reset')){startMeal()}
  else if(t.dataset.seat||t.dataset.dish){
    const nx=t.dataset.seat?{t:'p',id:t.dataset.seat}:{t:'d',id:t.dataset.dish};
    SEL=SEL&&SEL.t===nx.t&&SEL.id===nx.id?null:nx;renderTable();
  } else if(t.dataset.rmg||t.dataset.addg){
    const g=t.dataset.rmg||t.dataset.addg;
    if(t.dataset.rmg){GONE[g]=[];for(const id in D){const i=D[id].who.indexOf(g);if(i>-1){D[id].who.splice(i,1);GONE[g].push([id,i])}}}
    else{GONE[g].reverse().forEach(([id,i])=>D[id].who.splice(i,0,g));delete GONE[g]}
    refreshAll();
    if(t.dataset.rmg)toast(`${tr('{0} ירד מהארוחה',g)}`,()=>{GONE[g].reverse().forEach(([id,i])=>D[id].who.splice(i,0,g));delete GONE[g];refreshAll()});
  } else if(t.dataset.rm){
    const [id,w]=t.dataset.rm.split('|'),i=D[id].who.indexOf(w);
    D[id].who.splice(i,1);setWho(id);
    toast(`${tr('{0} ירד מ{1}',w,D[id].n)}`,()=>{D[id].who.splice(i,0,w);setWho(id)});
  } else if(t.hasAttribute('data-check')){const n=t.dataset.name;DONE.has(n)?DONE.delete(n):DONE.add(n);t.classList.toggle('done');save()}
  else if(t.hasAttribute('data-copy')){
    const txt=tr('רשימת קניות לשישי')+'\n'+shopData().filter(([g])=>g!=='כנראה יש בבית').map(([g,rows])=>tr(g)+':\n'+rows.map(r=>`- ${r.n}${r.q?' ('+r.q+')':''}`).join('\n')).join('\n');
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(tr('הועתק!')),()=>toast(tr('אי אפשר להעתיק כאן')));
  } else if(t.matches('.v2 nav a')){
    e.preventDefault();const sc=stage.querySelector('#sc'),tg=sc.querySelector(t.getAttribute('href'));sc.scrollTo({top:tg.offsetTop-52,behavior:'instant'});
  }
});


}

</script>
</body>
</html>
