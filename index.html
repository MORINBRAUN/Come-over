<head>

<title>Come Over: אונבורדינג</title>
<style>
:root{--cream:#fbf5ec;--paper:#fffdf9;--ink:#2a211b;--muted:#7d6e62;--line:#eadfce;--accent:#d1572f;--accent-soft:#fbe3d8;--green:#4f7a58;--green-soft:#e2eede;--ease:cubic-bezier(0.23,1,0.32,1)}
*{box-sizing:border-box;margin:0}
html,body{background:#e9e4dc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Heebo","Arial Hebrew",Arial,sans-serif;color:var(--ink)}
body{min-height:100vh;display:flex;justify-content:center;padding:16px 0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.phone{width:390px;max-width:100%;height:780px;max-height:calc(100vh - 32px);background:var(--cream);border-radius:34px;overflow:hidden;position:relative;box-shadow:0 0 0 8px #1d1713,0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column}
@media (max-width:430px){body{padding:0}.phone{border-radius:0;box-shadow:none;height:100vh;height:100dvh;max-height:none}}
.status{height:30px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600;direction:ltr}
.top{flex:none;display:flex;align-items:center;gap:12px;padding:4px 16px 8px}
.back{width:40px;height:40px;border-radius:50%;font-size:20px;color:var(--muted);transition:transform 120ms ease-out}.back:active{transform:scale(.92)}.back[hidden]{visibility:hidden;display:block!important}
.bar{flex:1;height:6px;background:#efe5d6;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width 300ms var(--ease)}
.cnt{font-size:12px;color:var(--muted);min-width:44px;text-align:left;font-variant-numeric:tabular-nums}
.stage{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px 24px 20px;overflow-y:auto;animation:in 300ms var(--ease) both}
.screen.back-in{animation-name:inback}
@keyframes in{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes inback{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.bar i{transition:none}.mic.rec{animation:none}*{transition:none!important}}
h1{font-size:28px;line-height:1.2;margin:8px 0 6px}
.sub{color:var(--muted);font-size:15px;line-height:1.45;margin-bottom:16px}
textarea,input[type=text]{width:100%;font:inherit;font-size:17px;line-height:1.5;border:1.5px solid var(--line);border-radius:16px;padding:14px;background:var(--paper);color:var(--ink);resize:none}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.tawrap{position:relative}.tawrap textarea{padding-bottom:52px}
.mic{position:absolute;bottom:10px;left:10px;width:44px;height:44px;border-radius:50%;background:var(--accent-soft);font-size:20px;display:grid;place-items:center;transition:background 150ms ease-out,transform 120ms ease-out}
.mic:active{transform:scale(.92)}.mic.rec{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.micmsg{font-size:13px;color:#9a3a18;min-height:18px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 8px 6px 12px;border-radius:99px;background:#efe5d6;font-size:14px;transition:background 150ms ease-out}
.chip button{width:24px;height:24px;border-radius:50%;color:var(--muted);font-size:16px;line-height:1}
.chip.sel{background:var(--accent-soft);color:#9a3a18;padding:9px 14px;font-weight:600}
.chip.pick{padding:9px 14px;font-size:15px}.chip.pick:active{transform:scale(.96)}
.chip.like{background:var(--green-soft);color:#2f5a38}.chip.avoid{background:#fdecc8;color:#7a5200}.chip.note{background:#efe5d6}
.lbl{font-size:12px;color:var(--muted);margin:16px 0 0;letter-spacing:.04em}
.spacer{flex:1;min-height:12px}
.cta{width:100%;background:var(--accent);color:#fff;padding:16px;border-radius:18px;font-weight:700;font-size:17px;margin-top:16px;transition:transform 120ms ease-out,opacity 150ms;flex:none}
.cta:active{transform:scale(.98)}.cta:disabled{opacity:.4}
.link{display:block;margin:12px auto 0;font-size:14px;color:var(--muted);text-decoration:underline;padding:8px;flex:none}
.big{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:16px;font-size:17px;transition:border-color 150ms ease-out,background 150ms ease-out}
.opt:active{transform:scale(.99)}.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.emoji{font-size:26px}
.who{display:flex;align-items:center;gap:12px;margin-bottom:6px}.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;background:var(--accent-soft);color:#9a3a18}
/* menu rows */
.mg{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.06em;margin:16px 0 6px}
.mrow{display:flex;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;margin-bottom:8px;transition:border-color 150ms ease-out,background 150ms ease-out}
.mrow.on{border-color:#e8b9a5;background:#fff8f3}
.mrow .tog{width:52px;height:56px;flex:none;display:grid;place-items:center}
.mrow .tick{width:24px;height:24px;border-radius:50%;border:2px solid #cdbda7;display:grid;place-items:center;transition:background 150ms ease-out,border-color 150ms ease-out}
.mrow.on .tick{background:var(--accent);border-color:var(--accent)}.mrow.on .tick::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(40deg) translate(-1px,-1px)}
.mrow .body{flex:1;text-align:right;padding:10px 0;min-height:56px;display:flex;flex-direction:column;justify-content:center}
.mrow b{font-size:17px}.mrow .meta{font-size:13px;color:var(--muted);margin-top:2px}
.mrow:not(.on) b{color:var(--muted)}
.mrow .go{width:40px;font-size:18px;color:var(--muted);flex:none;text-align:center}
.badge{display:inline-block;font-size:11px;background:#efe5d6;color:var(--muted);border-radius:99px;padding:1px 8px;margin-right:6px;font-weight:600}
.note2{background:#fdecc8;color:#7a5200;border-radius:12px;padding:9px 12px;font-size:13px;margin-top:10px}
/* method screen */
.meth{display:flex;flex-direction:column;gap:6px;text-align:right;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;transition:border-color 150ms ease-out,background 150ms ease-out}
.meth:active{transform:scale(.99)}.meth[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}

.meth .why{font-size:13px;color:#2f5a38}
a.cta{display:block;text-align:center;text-decoration:none}
.otoast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#2a211b;color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;white-space:nowrap;animation:in 200ms var(--ease) both}

[hidden]{display:none!important}

.spin{width:44px;height:44px;border-radius:50%;border:4px solid #efe5d6;border-top-color:var(--accent);animation:sp 800ms linear infinite;margin:40px auto 18px}@keyframes sp{to{transform:rotate(360deg)}}

<div class="phone" id="phone">
  <div class="status"><span>9:41</span><span></span></div>
  <div class="top"><button class="back" id="back" aria-label="חזרה" hidden>→</button><div class="bar" role="progressbar" aria-label="התקדמות"><i id="prog"></i></div><span class="cnt" id="cnt"></span></div>
  <div class="stage" id="stage"></div>
</div>

<script>
/* ======== sample data from notes/guests.md (pre-filled so the flow can be tapped through) ======== */
const SAMPLE_NAMES='שושנה, צבי, קרן, מתי, אלירן, עידו, הילה, מורין, מיתר, איציק';
const SAMPLE={
 'שושנה':'אוהבת סלט מיונז, עוף וסלט עגבניות שרי עם כוסברה (מאוד). אוכלת הכל.',
 'צבי':'אוהב סלט מיונז ועוף. אוכל הכל.',
 'קרן':'אוהבת סלט כרוב סגול, קולסלו, עוף ופרגית. בררנית ומפונקת באוכל.',
 'מתי':'אוהב מנגל, עוף צלוי בגריל, תפוחי אדמה ודגים. בלי ירקות, בלי בצל ושום. מעט שמן.',
 'אלירן':'אוהב שניצל, אורז, סלט ירקות וכרובית.',
 'עידו':'אוהב כרובית (ממש), סלמון ושניצל.',
 'הילה':'אוהבת פירה ושניצל.',
 'מורין':'אוהבת עוף, פרגית וכבד.',
 'מיתר':'אוהבת עוף, פרגית, כנפיים על האש, אורז, שעועית, צ׳יפס ופירה. מאוד בררנית.',
 'איציק':'אוכל הכל.'
};
const FEM=new Set(['שושנה','קרן','הילה','מיתר','מורין']);
const KOSHER_SAMPLE=['קרן','מתי','אלירן','עידו','הילה'];

/* ======== dish catalog: keywords decide who gets what; methods decide how it is made ======== */
const B='בשר ודגים',V='ירקות',Y='יבשים וקירור';
const LEMON=['לימון',V,['לימון','לימונים'],1,1],EGG=['ביצים',Y,['ביצה','ביצים'],.5];
const PT=['תפוח אדמה בינוני','תפוחי אדמה בינוניים'];
const COAL=[['פחמים',Y,['שקית','שקיות'],1,1,1],['מצית ארוך',Y,['יחידה','יחידות'],1,1,1]]; /* 6th value: buy once, however many dishes need it */

function parseNames(t){
  if(/[\n,،]/.test(t))return [...new Set(t.split(/[\n,،]+/).map(x=>x.trim()).filter(Boolean))];
  return [...new Set(t.split(/\s+/).filter(Boolean).map((x,i)=>i>0&&x[0]==='ו'&&x.length>=4?x.slice(1):x))]}
/* tiny stand-in for the real "understand free text" step, sentence by sentence */
function extract(text){
  const out={likes:[],avoid:[],notes:[]};
  text.split(/[.\n]+/).map(s=>s.trim()).filter(Boolean).forEach(s=>{
    const items=x=>x.split(/,|\sו(?=\S)/).map(i=>i.replace(/^(ו|את)\s*/,'').trim()).filter(Boolean);
    if(/^בלי\s/.test(s)){out.avoid.push(...items(s.replace(/^בלי\s*/,'')).map(i=>i.replace(/^בלי\s*/,'')))}
    else if(/לא (אוכל|אוכלת|אוהב|אוהבת)/.test(s)){out.avoid.push(...items(s.replace(/.*לא (אוכל|אוכלת|אוהב|אוהבת)\s*/,'')))}
    else if(/^(אוהב|אוהבת)\s/.test(s)){out.likes.push(...items(s.replace(/^(אוהב|אוהבת)\s*/,'')))}
    else out.notes.push(s);
  });
  return out}
const kept=(n,k)=>{const x=extract(S.txt[n]||''),d=S.drop[n]||new Set();return x[k].filter(t=>!d.has(k+':'+t))};

/* ======== the suggestion: who likes what -> which dishes, how ======== */
const clean=t=>t.replace(/\(.*?\)/g,'').trim();
function excluded(n,dish){
  const av=kept(n,'avoid');
  return av.some(a=>(dish.tag||[]).some(t=>a.includes(t)||t.includes(a))||dish.kw.some(k=>a.includes(k)||k.includes(a)))}
function suggest(){
  const last=lastServed(),menu={};
  CAT.forEach(d=>menu[d.id]={on:false,m:0,who:[],manual:false});
  S.unmatched=[];
  const eatsAll=new Set(),lowOil=new Set(),liked={};
  S.names.forEach(n=>{
    const all=(S.txt[n]||'');if(/אוכל(ת)? הכל/.test(all))eatsAll.add(n);if(/מעט שמן/.test(all))lowOil.add(n);
    kept(n,'likes').forEach(item=>{
      const it=clean(item);let best=null,bl=0;
      CAT.forEach(d=>d.kw.forEach(k=>{if(it.includes(k)&&k.length>bl){best=d;bl=k.length}}));
      if(!best){S.unmatched.push({n,item:it});return}
      if(excluded(n,best))return;
      if(!menu[best.id].who.includes(n))menu[best.id].who.push(n);
      (liked[best.id]=liked[best.id]||[]).push(it);
    })});
  CAT.forEach(d=>{const m=menu[d.id];
    if(m.who.length>=2)eatsAll.forEach(n=>{if(!m.who.includes(n)&&!excluded(n,d))m.who.push(n)});
    /* default method: what an eater asked for ("על האש"), else low oil if an eater needs it, else the first */
    const asked=(liked[d.id]||[]).join(' ');
    let idx=d.M.findIndex(x=>x.fire&&/על האש|גריל|מנגל/.test(asked));
    if(idx<0&&m.who.some(n=>lowOil.has(n)))idx=d.M.findIndex(x=>x.low);
    m.m=Math.max(0,idx);
    m.on=m.who.length>0;
  });
  /* nobody wrote enough? then suggest a plain Friday dinner, so the screen is never empty */
  const pop=id=>{const d=DISH[id],m=menu[id];S.names.forEach(n=>{if(!m.who.includes(n)&&!excluded(n,d))m.who.push(n)});m.on=m.who.length>0};
  S.defaulted=CAT.filter(d=>menu[d.id].who.length).length<3;
  if(S.defaulted)['schnitzel','pargit','rice','potato','chopped'].forEach(pop);
  else S.names.forEach(n=>{if(!CAT.some(d=>menu[d.id].who.includes(n))){['schnitzel','rice'].forEach(id=>{const d=DISH[id],m=menu[id];if(!excluded(n,d)){m.who.push(n);m.on=true}})}});
  return menu}
const dishWho=id=>{const m=S.menu[id];return m.who.length?m.who:S.names.filter(n=>!excluded(n,DISH[id]))};

  ${d.M.map((x,i)=>`<button class="meth" data-m="${i}" aria-pressed="${m.m===i}"><b>${x.n}</b><span class="facts"><span>⏱ ${x.t}</span><span>🫒 ${x.oil}</span><span>${x.lvl}</span>${x.fire?'<span>צריך גריל</span>':''}</span>${i===m.m&&sugReason(d,m,x)?`<span class="why">${sugReason(d,m,x)}</span>`:''}</button>`).join('')}

/* ======== dictation (speech to text) ======== */
let rec=null;
function dictate(btn){
  const ta=btn.parentElement.querySelector('textarea'),msg=$('micmsg');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){msg.textContent='ההכתבה לא נתמכת בדפדפן הזה. לחצי על המיקרופון במקלדת של הטלפון.';return}
  if(rec){rec.stop();return}
  rec=new SR();rec.lang='he-IL';rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=()=>{btn.classList.add('rec');msg.textContent='מקשיבה… דברי'};
  rec.onresult=e=>{const t=[...e.results].map(r=>r[0].transcript).join(' ').trim();if(!t)return;ta.value+=(ta.value&&!/\s$/.test(ta.value)?' ':'')+t;ta.dispatchEvent(new Event('input',{bubbles:true}))};
  rec.onerror=e=>{msg.textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?'אין הרשאה למיקרופון בדף הזה. לחצי על המיקרופון במקלדת של הטלפון.':'לא הצלחתי לשמוע. נסי שוב או השתמשי במיקרופון של המקלדת.'};
  rec.onend=()=>{btn.classList.remove('rec');if(msg.textContent.startsWith('מקשיבה'))msg.textContent='';rec=null};
  try{rec.start()}catch(_){rec=null;msg.textContent='לא הצלחתי להפעיל את המיקרופון.'}}

function seatSVG(name,x,y,ang,sel){

  return `<g transform="translate(${x},${y}) rotate(${ang})" class="person${sel?' sel':''}" data-seat="${name}" role="button" tabindex="0" aria-label="${name}">
    <circle cy="-22" r="26" fill="transparent"/>
    <circle cy="17" r="13" fill="#fff" stroke="#e2d6c4"/><circle cy="17" r="8" fill="none" stroke="#eee6d8"/>

    <rect x="-16" y="-50" width="32" height="28" rx="7" fill="#a9825c"/>
    <ellipse cy="-30" rx="${17*sx}" ry="${9*sx}" fill="${SHIRT[gi%10]}"/>

    <circle class="ring" cy="-20" r="${hr+9}" fill="none" stroke="#d1572f" stroke-width="2.5"/>
  </g><text x="${nx}" y="${ny}" text-anchor="middle" font-size="12" class="nm${sel?' sel':''}">${name}</text>`}
function tableSVG(){

  let g='';

/* ---------- in-variant interactions ---------- */
let toastTimer;
function toast(msg,undo){stage.querySelector('.toast')?.remove();clearTimeout(toastTimer);const p=stage.querySelector('.phone');const t=document.createElement('div');t.className='toast';t.textContent=msg;if(undo){const b=document.createElement('button');b.textContent='ביטול';b.onclick=()=>{undo();t.remove()};t.appendChild(b)}p.appendChild(t);toastTimer=setTimeout(()=>t.remove(),undo?4000:1800)}
function refreshAll(){save();renderTable();for(const id in D)setWho(id);stage.querySelector('#guests').innerHTML=guestsHTML();stage.querySelector('#heroP').textContent=heroP()}
function setWho(id){const r=stage.querySelector(`[data-row="${id}"]`);r.querySelector('.who').innerHTML=whoHTML(id);r.querySelector('.meta').textContent=metaHTML(id);r.classList.toggle('hide',!!D[id].alt&&!D[id].who.length);stage.querySelector('#shop').innerHTML=shopHTML();stage.querySelector('#recs').innerHTML=recsHTML();renderTable()}
stage.addEventListener('submit',e=>{e.preventDefault();const i=e.target.elements.x,v=i.value.trim();if(!v)return;EXTRA.push(v.slice(0,60));i.value='';save();stage.querySelector('#shop').innerHTML=shopHTML();toast('נוסף לרשימה')});
stage.addEventListener('input',e=>{if(e.target.dataset.note){INFO[e.target.dataset.note][1]=e.target.value;save();renderTable()}});
stage.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-seat],[data-dish]')){e.preventDefault();e.target.closest('[data-seat],[data-dish]').dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
stage.addEventListener('click',e=>{
  const t=e.target.closest('[data-check],[data-copy],[data-menu],[data-serve],[data-restart],[data-rm],[data-rmg],[data-addg],[data-seat],[data-dish],[data-xdel],[data-pref-open],[data-pref],[data-close],[data-reset],.v2 nav a');
  if(!t)return;
  if(t.hasAttribute('data-menu')){leaveMeal()}
  else if(t.hasAttribute('data-restart')){S.names=[];S.menu=null;S.kosher=null;S.txt={};S.drop={};S.kWho=new Set();clearPlan();leaveMeal(0)}
  else if(t.hasAttribute('data-serve')){const ids=Object.keys(D).filter(i=>D[i].who.length);try{localStorage.setItem(HK,JSON.stringify({date:'2026-10-30',ids}))}catch(_){}t.disabled=true;t.textContent='✔ נשמר. בפעם הבאה לא אחזור על זה';toast('נשמר')}
  else if(t.dataset.xdel!==undefined){const n=EXTRA.splice(+t.dataset.xdel,1)[0];save();stage.querySelector('#shop').innerHTML=shopHTML();toast(`${n} נמחק`,()=>{EXTRA.push(n);save();stage.querySelector('#shop').innerHTML=shopHTML()})}
  else if(t.dataset.prefOpen){openPrefs(t.dataset.prefOpen)}
  else if(t.dataset.pref){
    const [id,w]=t.dataset.pref.split('|'),i=D[id].who.indexOf(w);
    if(i>-1)D[id].who.splice(i,1);else D[id].who.push(w);
    t.classList.toggle('done',i<0);refreshAll();
  } else if(t.hasAttribute('data-close')){stage.querySelector('.sheet')?.remove()}
  else if(t.hasAttribute('data-reset')){startMeal()}
  else if(t.dataset.seat||t.dataset.dish){
    const nx=t.dataset.seat?{t:'p',id:t.dataset.seat}:{t:'d',id:t.dataset.dish};
    SEL=SEL&&SEL.t===nx.t&&SEL.id===nx.id?null:nx;renderTable();
  } else if(t.dataset.rmg||t.dataset.addg){
    const g=t.dataset.rmg||t.dataset.addg;
    if(t.dataset.rmg){GONE[g]=[];for(const id in D){const i=D[id].who.indexOf(g);if(i>-1){D[id].who.splice(i,1);GONE[g].push([id,i])}}}
    else{GONE[g].reverse().forEach(([id,i])=>D[id].who.splice(i,0,g));delete GONE[g]}
    refreshAll();
    if(t.dataset.rmg)toast(`${g} ירד מהארוחה`,()=>{GONE[g].reverse().forEach(([id,i])=>D[id].who.splice(i,0,g));delete GONE[g];refreshAll()});
  } else if(t.dataset.rm){
    const [id,w]=t.dataset.rm.split('|'),i=D[id].who.indexOf(w);
    D[id].who.splice(i,1);setWho(id);
    toast(`${w} ירד מ${D[id].n}`,()=>{D[id].who.splice(i,0,w);setWho(id)});
  } else if(t.hasAttribute('data-check')){const n=t.dataset.name;DONE.has(n)?DONE.delete(n):DONE.add(n);t.classList.toggle('done');save()}
  else if(t.hasAttribute('data-copy')){
    const txt='רשימת קניות לשישי\n'+[B,V,Y].map(g=>g+':\n'+Object.values(need()).filter(i=>i.g===g).map(i=>`- ${i.n} (${fmtQ(i.v,i.u)})`).join('\n')).join('\n')+(EXTRA.length?'\nעוד:\n'+EXTRA.map(n=>`- ${n}`).join('\n'):'');
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('הועתק!'),()=>toast('אי אפשר להעתיק כאן'));
  } else if(t.matches('.v2 nav a')){
    e.preventDefault();const sc=stage.querySelector('#sc'),tg=sc.querySelector(t.getAttribute('href'));sc.scrollTo({top:tg.offsetTop-52,behavior:'instant'});
  }
});


}

</script>
</body>
</html>
